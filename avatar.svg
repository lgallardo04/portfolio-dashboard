<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definitions of gradients and glows -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0e1b2f" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF85" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle with border -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="url(#cyberGrad)" stroke-width="2.5" />
  
  <!-- Grid background inside the avatar -->
  <g opacity="0.15">
    <line x1="20" y1="50" x2="180" y2="50" stroke="#00F0FF" stroke-width="0.5" />
    <line x1="20" y1="80" x2="180" y2="80" stroke="#00F0FF" stroke-width="0.5" />
    <line x1="20" y1="110" x2="180" y2="110" stroke="#00F0FF" stroke-width="0.5" />
    <line x1="20" y1="140" x2="180" y2="140" stroke="#00F0FF" stroke-width="0.5" />
    
    <line x1="50" y1="20" x2="50" y2="180" stroke="#00F0FF" stroke-width="0.5" />
    <line x1="80" y1="20" x2="80" y2="180" stroke="#00F0FF" stroke-width="0.5" />
    <line x1="110" y1="20" x2="110" y2="180" stroke="#00F0FF" stroke-width="0.5" />
    <line x1="140" y1="20" x2="140" y2="180" stroke="#00F0FF" stroke-width="0.5" />
  </g>

  <!-- Glowing tech nodes in the background -->
  <circle cx="60" cy="60" r="4" fill="#00FF85" filter="url(#glow)" />
  <circle cx="140" cy="70" r="3" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="150" cy="110" r="5" fill="#00FF85" filter="url(#glow)" opacity="0.7" />
  
  <path d="M 60 60 L 80 80 L 110 50" fill="none" stroke="#00FF85" stroke-dasharray="2,2" stroke-width="1" opacity="0.4" />
  <path d="M 140 70 L 120 90 L 100 80" fill="none" stroke="#00F0FF" stroke-dasharray="2,2" stroke-width="1" opacity="0.4" />

  <!-- Developer Silhouette -->
  <!-- Shoulders -->
  <path d="M45,160 C45,135 65,120 100,120 C135,120 155,135 155,160 L155,175 C155,178 152,180 148,180 L52,180 C48,180 45,178 45,175 Z" fill="#13243d" stroke="#00F0FF" stroke-width="1.5" />
  
  <!-- Face/Head -->
  <circle cx="100" cy="82" r="28" fill="#1c375c" stroke="#00FF85" stroke-width="1.5" />
  
  <!-- Hair (Cool Programmer style, stylized shape) -->
  <path d="M72,82 C72,60 85,50 100,50 C115,50 128,60 128,82 C128,78 120,68 100,68 C80,68 72,78 72,82 Z" fill="#0b1728" />

  <!-- Code/Tech Glasses (Stylized glowing glasses) -->
  <g filter="url(#glow)">
    <!-- Left Glass -->
    <rect x="83" y="78" width="12" height="8" rx="2" fill="none" stroke="#00F0FF" stroke-width="2" />
    <!-- Right Glass -->
    <rect x="105" y="78" width="12" height="8" rx="2" fill="none" stroke="#00F0FF" stroke-width="2" />
    <!-- Bridge -->
    <line x1="95" y1="82" x2="105" y2="82" stroke="#00F0FF" stroke-width="2" />
  </g>
  
  <!-- Headphone Band -->
  <path d="M74,78 C74,60 84,54 100,54 C116,54 126,60 126,78" fill="none" stroke="#00FF85" stroke-width="3" opacity="0.8" />
  <!-- Headphone Ears -->
  <rect x="70" y="72" width="6" height="15" rx="3" fill="#00FF85" />
  <rect x="124" y="72" width="6" height="15" rx="3" fill="#00FF85" />

  <!-- Glowing Laptop screen representation at the bottom -->
  <path d="M 60,180 L 140,180 L 130,165 L 70,165 Z" fill="url(#neonCyan)" stroke="url(#cyberGrad)" stroke-width="1" />
  <!-- Laptop Keyboard Base -->
  <path d="M 50,180 L 150,180 L 155,183 L 45,183 Z" fill="#0c192c" stroke="#00F0FF" stroke-width="1" />
  <line x1="75" y1="181.5" x2="125" y2="181.5" stroke="#00FF85" stroke-width="1.5" filter="url(#glow)" />
</svg>
